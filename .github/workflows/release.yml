name: Release

# Tag-driven. Pushing a tag that looks like a version builds both
# architectures on GitHub's runners and publishes the result; nothing is
# compiled on a laptop and uploaded by hand.
#
#   git tag v4.6.0 && git push origin v4.6.0
#
# The alternative — cross-compiling locally and attaching the files — makes the
# artefact depend on whoever's machine happened to build it, and there is no
# record of how. Here the build is the workflow, and it can be re-run.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Rebuild a release whose runner was broken, or whose assets are wrong.
  #
  # The assets of an existing release are replaced, not merged, so this
  # overwrites what was published under that tag. It is a deliberate action and
  # the workflow refuses to run when the release already exists without
  # "replace" being asked for explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
      replace:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm64
            suffix: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Test
        run: go test ./...

      # scripts/build.sh builds the frontend and then the binary, and removes
      # frontend/dist first so a stale bundle cannot be embedded silently.
      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
          CGO_ENABLED: '0'
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          # The leading v is stripped inside the script, so the binary reports
          # "4.6.0" and matches the tag without the decoration.
          ./scripts/build.sh "happy-downloader_${{ matrix.suffix }}"

          # A binary that embedded no frontend still compiles, so check the
          # artefact is plausible rather than trusting the exit code.
          test -x "happy-downloader_${{ matrix.suffix }}"
          size=$(stat -c %s "happy-downloader_${{ matrix.suffix }}")
          echo "built ${{ matrix.suffix }}: ${size} bytes"
          if [ "$size" -lt 8000000 ]; then
            echo "binary is too small — the frontend was probably not embedded" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: happy-downloader_${{ matrix.suffix }}
          path: happy-downloader_${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum happy-downloader_* > SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: |
          set -eu
          # A published SHA256SUMS that does not match the files is worse than
          # none, so the file is checked against itself before it ships.
          sha256sum -c SHA256SUMS
          ls -l

      - name: Refuse to overwrite an existing release
        if: github.event_name == 'workflow_dispatch' && !inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists." >&2
            echo "Its assets would be replaced. Re-run with replace=true if that is what you want." >&2
            exit 1
          fi

      - name: Report the release being written
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "publishing $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "note: $tag already has a release; its assets will be replaced" >&2
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/happy-downloader_linux-amd64
            dist/happy-downloader_linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
