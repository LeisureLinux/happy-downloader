name: Release

# Built here, not on a laptop, but started deliberately.
#
# A patch is small and goes out from the machine that is deploying it, so this
# workflow is not the default path; see VERSIONING.md. It is for the releases
# that have to be reproducible and announced: every minor, and any release
# asked for explicitly. Both are started by hand:
#
#   gh workflow run release.yml -f tag=v4.8.0
#
# It used to fire on a tag push. That made every tag a release whether or not
# anybody meant it, and left no way to publish a patch without waiting for a
# runner. The number of tags and the number of releases are still kept equal —
# scripts/check-releases.sh checks that — but the trigger is now a decision.
on:
  # Rebuild a release whose runner was broken, or whose assets are wrong.
  #
  # The assets of an existing release are replaced, not merged, so this
  # overwrites what was published under that tag. It is a deliberate action and
  # the workflow refuses to run when the release already exists without
  # "replace" being asked for explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
      replace:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            os: linux
            suffix: linux-amd64
          - goarch: arm64
            os: linux
            suffix: linux-arm64
          - goarch: amd64
            os: windows
            suffix: windows-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag being released, so that git describe — which is where the
          # version number comes from — names that tag and not whatever the
          # default branch points at.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The version number is checked before anything is built, so a mistake
      # costs a minute rather than a release.
      - name: Check the version number
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          ./scripts/check-version.sh "$tag"

      # scripts/build.sh builds the frontend and then the binary, and removes
      # frontend/dist first so a stale bundle cannot be embedded silently.
      #
      # It has to run before the tests: the frontend is embedded with go:embed,
      # so the root package does not even compile until frontend/dist exists.
      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.os }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          # An executable on Windows carries the suffix; everywhere else it
          # does not. The name is decided here rather than in the workflow,
          # because a shell variable does not cross a step.
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            name="${name}.exe"
          fi

          # The version comes from the checked-out tag, so the binary cannot
          # report anything but what is being released.
          ./scripts/build.sh "$name"

          # A binary that embedded no frontend still compiles, so check the
          # artefact is plausible rather than trusting the exit code.
          test -f "$name"
          size=$(stat -c %s "$name")
          echo "built $name, ${size} bytes"
          if [ "$size" -lt 8000000 ]; then
            echo "binary is too small — the frontend was probably not embedded" >&2
            exit 1
          fi

      # The files the installer puts on the machine, gathered in one directory.
      #
      # A release that ships only the binary asks the person installing it to
      # install Python and a media toolkit as well, and to write down where
      # they ended up. This is the answer to that: the installer carries them.
      # Assembling it here, from the same files on every platform, is what
      # keeps the installer from containing something untested.
      - name: Stage the files the installer needs
        run: |
          set -eu
          ./scripts/stage.sh "stage_${{ matrix.suffix }}" "${{ matrix.os }}" "${{ matrix.goarch }}"

          # A staging directory that is missing a program is worse than none:
          # the installer built from it looks complete and fails on the first
          # download. So it is checked rather than trusted.
          for program in yt-dlp ffmpeg; do
            found=$(find "stage_${{ matrix.suffix }}" -maxdepth 1 -name "$program*" | head -1)
            if [ -z "$found" ]; then
              echo "nothing was staged for $program" >&2
              exit 1
            fi
          done

      # A release is what people run, so the browser check runs here too: the
      # binary must not need a Chrome newer than Windows 7 has.
      - name: Browser support
        run: node frontend/scripts/check-browser-support.mjs

      - name: Test
        run: go test ./...

      # A Linux installer is one file that installs and starts the program:
      # there is no archive to unpack and no configuration to write by hand.
      - name: Build the installer (Linux)
        if: matrix.os == 'linux'
        run: |
          set -eu
          version="${{ inputs.tag }}"
          version="${version#v}"
          ./scripts/make-run.sh "stage_${{ matrix.suffix }}" \
            "happy-downloader_${version}_${{ matrix.suffix }}.run" "$version"

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: installer_${{ matrix.suffix }}
          path: happy-downloader_*_${{ matrix.suffix }}.run
          if-no-files-found: error
          retention-days: 7

      # Windows is packed by Inno Setup, which needs Windows, so the staged
      # files travel to the job that can do it.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows'
        with:
          name: stage_${{ matrix.suffix }}
          path: stage_${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

      # The bare binary is published for Linux only, because that is what a
      # server deploys. A bare Windows executable is a program that cannot
      # download anything until somebody finds yt-dlp for it, and publishing
      # one invites exactly that mistake; the installer is the form it ships
      # in.
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux'
        with:
          name: happy-downloader_${{ matrix.suffix }}
          path: happy-downloader_${{ matrix.suffix }}*
          if-no-files-found: error
          retention-days: 7

  # The Windows installer.
  #
  # A separate job because it needs Windows: the build job cross-compiles from
  # Linux, and Inno Setup is a Windows program. It takes the files the build
  # job staged rather than the source, so the installer cannot contain
  # anything that was not built by this run.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: stage_windows-amd64
          path: stage

      - name: What was staged
        shell: bash
        run: ls -l stage

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }

          # The version is the tag, without the "v" that git wants for a tag
          # name and Windows does not want in a product version.
          $version = '${{ inputs.tag }}'.TrimStart('v')

          & $iscc "/DBundleDir=$PWD\stage" "/DAppVersion=$version" `
            packaging\windows\happy-downloader.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "the installer was not produced" }
          "built $($setup.Name), $([math]::Round($setup.Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: installer_windows-amd64
          path: dist/*setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      # Every artifact is downloaded, because the publish job has no matrix of
      # its own: it does not know which platforms were built.
      #
      # The installers are downloaded apart from the binaries because a
      # download into a path that already holds something clears it first.
      - uses: actions/download-artifact@v4
        with:
          pattern: installer_*
          path: installers
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: happy-downloader_*
          path: dist
          merge-multiple: true

      # The installers arrive in their own directory, because a download into a
      # path that already has something in it clears it first.
      - name: Collect the installers
        run: |
          set -eu
          mv installers/* dist/
          rmdir installers
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          # The binaries are matched as happy-downloader_<suffix>, the
          # installers as happy-downloader_<version>_<suffix>, and both are
          # covered by the one pattern.
          sha256sum happy-downloader_* > SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: |
          set -eu
          # A published SHA256SUMS that does not match the files is worse than
          # none, so the file is checked against itself before it ships.
          sha256sum -c SHA256SUMS
          ls -l

      - name: Refuse to overwrite an existing release
        if: ${{ !inputs.replace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists." >&2
            echo "Its assets would be replaced. Re-run with replace=true if that is what you want." >&2
            exit 1
          fi

      - name: Report the release being written
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          echo "publishing $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "note: $tag already has a release; its assets will be replaced" >&2
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # The installed form is the installer, one file per platform; the
          # bare binaries are published beside them because they are what the
          # tests run and what a server deployment installs.
          files: |
            dist/happy-downloader_*_windows-amd64_setup.exe
            dist/happy-downloader_*_linux-amd64.run
            dist/happy-downloader_*_linux-arm64.run
            dist/happy-downloader_linux-amd64
            dist/happy-downloader_linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  # A publish that half-worked — the tag exists, the release does not — is the
  # drift that put 4.10.0 on a binary whose newest release was 4.6.0. Checking
  # it here means the run that created the tag is the run that reports it.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the audit sees the whole set rather than the one
          # being released.
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh
