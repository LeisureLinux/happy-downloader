name: Release

# Built here, not on a laptop, but started deliberately.
#
# A patch is small and goes out from the machine that is deploying it, so this
# workflow is not the default path; see VERSIONING.md. It is for the releases
# that have to be reproducible and announced: every minor, and any release
# asked for explicitly. Both are started by hand:
#
#   gh workflow run release.yml -f tag=v4.8.0
#
# It used to fire on a tag push. That made every tag a release whether or not
# anybody meant it, and left no way to publish a patch without waiting for a
# runner. The number of tags and the number of releases are still kept equal —
# scripts/check-releases.sh checks that — but the trigger is now a decision.
on:
  # Rebuild a release whose runner was broken, or whose assets are wrong.
  #
  # The assets of an existing release are replaced, not merged, so this
  # overwrites what was published under that tag. It is a deliberate action and
  # the workflow refuses to run when the release already exists without
  # "replace" being asked for explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
      replace:
        description: 'Replace the assets of an existing release'
        type: boolean
        default: false

permissions:
  contents: write

# Three files, one per platform and architecture:
#
#   happy-downloader_<version>_windows-amd64_setup.exe   the installer
#   happy-downloader_linux-amd64                         the static binary
#   happy-downloader_linux-arm64                         the static binary
#
# Linux is published as the program itself, because that is what a server
# installs and what the deployment on the other end of this project runs.
# Windows is published as an installer, because a Windows user double-clicks
# something and expects it to be installed.
#
# Windows on ARM is not built: there is no ffmpeg-static build for it, and an
# installer that cannot merge a video is not worth publishing.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: amd64
            suffix: windows-amd64
            platform: windows
          - goarch: amd64
            suffix: linux-amd64
            platform: linux
          - goarch: arm64
            suffix: linux-arm64
            platform: linux

    steps:
      - uses: actions/checkout@v4
        with:
          # The tag being released, so that git describe — which is where the
          # version number comes from — names that tag and not whatever the
          # default branch points at.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The version number is checked before anything is built, so a mistake
      # costs a minute rather than a release.
      - name: Check the version number
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          ./scripts/check-version.sh "$tag"

      # scripts/build.sh builds the frontend and then the binary, and removes
      # frontend/dist first so a stale bundle cannot be embedded silently.
      #
      # It has to run before the tests: the frontend is embedded with go:embed,
      # so the root package does not even compile until frontend/dist exists.
      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            name="${name}.exe"
          fi

          # The version comes from the checked-out tag, so the binary cannot
          # report anything but what is being released.
          ./scripts/build.sh "$name"

          # A binary that embedded no frontend still compiles, so check the
          # artefact is plausible rather than trusting the exit code.
          test -f "$name"
          size=$(stat -c %s "$name")
          echo "built $name, ${size} bytes"
          if [ "$size" -lt 8000000 ]; then
            echo "binary is too small — the frontend was probably not embedded" >&2
            exit 1
          fi

      # A release is what people run, so the browser check runs here too: the
      # interface must not need a Chrome newer than Windows 7 has.
      - name: Browser support
        if: matrix.suffix == 'linux-amd64'
        run: node frontend/scripts/check-browser-support.mjs

      # The tests are the same for both architectures, so they run once.
      - name: Test
        if: matrix.suffix == 'linux-amd64'
        run: go test ./...

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: happy-downloader_${{ matrix.suffix }}
          path: happy-downloader_${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

      - name: Stage the files the installer needs
        if: matrix.platform == 'windows'
        env:
          # The WebView2 runtime, so that the installer works on a machine that
          # has none — which is what Windows 7 is, and it can no longer install
          # one: the last version that runs there is 109, and Microsoft's
          # download page keeps only the two most recent.
          #
          # The version is pinned, and so is its checksum. The archive is a
          # third party's copy of a Microsoft package; the bytes are checked
          # against a value read once, so that a changed file is a failed build
          # rather than a silent one.
          HD_WEBVIEW2_URL: https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab
          HD_WEBVIEW2_SHA256: 7622281cf83de1a35e3a471f432f7a897d65f0a7d3975df08512b7b253dd45c7
        run: |
          set -eu

          # Unpacking a cabinet needs a tool; the runner usually has one.
          if ! command -v 7z >/dev/null 2>&1 && ! command -v cabextract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends p7zip-full
          fi

          ./scripts/stage.sh "stage_${{ matrix.suffix }}" windows "${{ matrix.goarch }}"

          # An installer that was meant to carry the runtime and did not is one
          # that falls back to a browser on the machine it was built for.
          if [ ! -f "stage_${{ matrix.suffix }}/webview2/msedgewebview2.exe" ]; then
            echo "the WebView2 runtime is not in the staging directory" >&2
            exit 1
          fi

          # A staging directory that is missing a program is worse than none:
          # the installer built from it looks complete and fails on the first
          # download. So it is checked rather than trusted.
          for program in yt-dlp ffmpeg; do
            found=$(find "stage_${{ matrix.suffix }}" -maxdepth 1 -name "$program*" | head -1)
            if [ -z "$found" ]; then
              echo "nothing was staged for $program" >&2
              exit 1
            fi
          done

          # And it has to be the machine the installer is for: an installer
          # holding a program built for something else installs a program that
          # does not start.
          for file in "stage_${{ matrix.suffix }}/yt-dlp.exe" \
                      "stage_${{ matrix.suffix }}/ffmpeg.exe" \
                      "stage_${{ matrix.suffix }}/happy-downloader_${{ matrix.suffix }}.exe"; do
            echo "$file: $(file -b "$file" | cut -c1-30)"
            case "$(file -b "$file")" in
              *x86-64*|*PE32+*) ;;
              *) echo "$file is not a Windows executable" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: stage_${{ matrix.suffix }}
          path: stage_${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7

  # The installer, which needs Windows to build: Inno Setup is a Windows
  # program and the build job cross-compiles from Linux.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: stage_windows-amd64
          path: stage

      - name: What was staged
        shell: bash
        run: ls -l stage

      - name: Build the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }

          # The version is the tag, without the "v" that git wants for a tag
          # name and Windows does not want in a product version.
          $version = '${{ inputs.tag }}'.TrimStart('v')

          & $iscc "/DBundleDir=$PWD\stage" "/DAppVersion=$version" `
            packaging\windows\happy-downloader.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "the installer was not produced" }
          "built $($setup.Name), $([math]::Round($setup.Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: installer_windows-amd64
          path: dist/*setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      # The release notes are generated from the commits between the previous
      # tag and this one, which gh reads from the repository it is standing in.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # Every installer is downloaded, because this job has no matrix of its
      # own: it does not know which architectures were built.
      - uses: actions/download-artifact@v4
        with:
          pattern: installer_*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: happy-downloader_linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -eu
          ls -l
          sha256sum happy-downloader_* > SHA256SUMS

      - name: Verify checksums
        working-directory: dist
        run: |
          set -eu
          # A published SHA256SUMS that does not match the files is worse than
          # none, so the file is checked against itself before it ships.
          sha256sum -c SHA256SUMS
          ls -l

      - name: Refuse to overwrite an existing release
        if: ${{ !inputs.replace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists." >&2
            echo "Its assets would be replaced. Re-run with replace=true if that is what you want." >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ inputs.tag }}"

          # An existing release is updated in place. Deleting it and creating
          # it again leaves nothing published if the second step fails, and a
          # version that exists as a tag and not as a release is the drift this
          # project has already been bitten by once.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              dist/happy-downloader_*_windows-amd64_setup.exe \
              dist/happy-downloader_linux-amd64 \
              dist/happy-downloader_linux-arm64 \
              dist/SHA256SUMS

            exit 0
          fi

          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/happy-downloader_*_windows-amd64_setup.exe \
            dist/happy-downloader_linux-amd64 \
            dist/happy-downloader_linux-arm64 \
            dist/SHA256SUMS

  # A publish that half-worked — the tag exists, the release does not — is the
  # drift that put 4.10.0 on a binary whose newest release was 4.6.0. Checking
  # it here means the run that created the tag is the run that reports it.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so the audit sees the whole set rather than the one
          # being released.
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh
