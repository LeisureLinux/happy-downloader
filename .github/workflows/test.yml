name: Test

# Runs on every push, so a broken commit is visible before a tag is cut. The
# release workflow repeats these checks, but by then the tag already exists and
# a failed build is a failed release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        env:
          GOARCH: amd64
          GOOS: linux
        run: ./scripts/build.sh happy-downloader

      # The bundle has to run in the last Chrome that installs on Windows 7.
      # Syntax is handled by the build target; an API that does not exist yet
      # is not, so it is checked here.
      - name: Browser support
        run: node frontend/scripts/check-browser-support.mjs



      - name: gofmt
        run: |
          set -eu
          # Reported rather than auto-fixed: a formatting failure in CI should
          # be fixed where it was written, not silently rewritten here.
          unformatted=$(gofmt -l server main.go)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Tags and releases are the same list. The check needs the whole tag set and
  # the GitHub API, so it is its own job rather than a step in the build.
  releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # Includes the translation-parity check: a missing key falls back to
      # English silently, so it has to be a test rather than something noticed
      # later.
      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run

  # The bundle: the application and the programs it needs, in one folder.
  #
  # It is what most people install, so it is checked on every push rather
  # than only when a release is cut. A bundle that is missing a program looks
  # complete and fails on the first download, and one whose programs are found
  # by name rather than by path runs whatever the machine happens to have.
  #
  # It runs on Windows as well as on Linux, because the Windows bundle is the
  # one that was never built before and the one that is most likely to have
  # something wrong in it.
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            platform: linux
            suffix: linux-amd64
          - os: windows-latest
            goarch: amd64
            platform: windows
            suffix: windows-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            name="${name}.exe"
          fi
          ./scripts/build.sh "$name"

      - name: The bundle
        shell: bash
        run: |
          set -eu
          ./scripts/bundle.sh bundle "${{ matrix.platform }}" "${{ matrix.goarch }}"

          for program in yt-dlp ffmpeg; do
            found=$(find bundle -maxdepth 1 -name "$program*" | head -1)
            if [ -z "$found" ]; then
              echo "the bundle has no $program in it" >&2
              exit 1
            fi
          done

          # The application has to find them beside itself, and report where
          # it found them. A name rather than a path in that answer means the
          # working directory decided which copy ran.
          # The application is found by name rather than by the name the
          # build gave it, because the build names it differently on
          # Windows.
          app=$(find bundle -maxdepth 1 -name 'happy-downloader*' -type f | head -1)
          if [ -z "$app" ]; then
            echo "the bundle has no application in it" >&2
            exit 1
          fi

          # The configuration is not read, so the application uses its
          # defaults, which put the state in the working directory.
          "$app" -conf ./no-such-config.yml > app.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          sleep 10

          found=$(curl -s --max-time 5 http://127.0.0.1:3033/api/v1/version || true)
          echo "$found"
          cat app.log 2>/dev/null | tail -20 || true

          # The path is checked by its name rather than by its separator,
          # because the separator is a backslash on Windows.
          case "$found" in
            *yt-dlp*) ;;
            *) echo "the application did not find the bundled yt-dlp: $found" >&2; exit 1 ;;
          esac
          case "$found" in
            *ffmpeg*) ;;
            *) echo "the application did not find the bundled ffmpeg: $found" >&2; exit 1 ;;
          esac

          kill $pid 2>/dev/null || true
          trap - EXIT

      # Installing it, which is what a person does, rather than running the
      # binary out of the folder it was built in.
      - name: The installer runs (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -eu

          rm -rf /tmp/hd-test
          ./bundle/install.sh \
            --prefix /tmp/hd-test/app \
            --config-dir /tmp/hd-test/config \
            --downloads /tmp/hd-test/downloads \
            --no-service

          # The files it claims to install.
          for f in app/bin/happy-downloader app/bin/yt-dlp app/bin/ffmpeg \
                   config/config.yml app/uninstall.sh; do
            if [ ! -e "/tmp/hd-test/$f" ]; then
              echo "the installer did not produce /tmp/hd-test/$f" >&2
              exit 1
            fi
          done

          # The configuration it wrote has to name paths that exist. A
          # configuration that names a program the installer did not put
          # there is the "exec: no command" failure with a longer message.
          grep -q 'downloader_path: /tmp/hd-test/app/bin/yt-dlp' /tmp/hd-test/config/config.yml
          grep -q 'ffmpeg_path: /tmp/hd-test/app/bin/ffmpeg' /tmp/hd-test/config/config.yml
          grep -q 'download_path: /tmp/hd-test/downloads' /tmp/hd-test/config/config.yml

          # And it has to start, from where it was installed.
          /tmp/hd-test/app/bin/happy-downloader -conf /tmp/hd-test/config/config.yml > /tmp/hd-test/app.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          sleep 10

          found=$(curl -s --max-time 5 http://127.0.0.1:3033/api/v1/version || true)
          echo "$found"
          tail -20 /tmp/hd-test/app.log || true

          case "$found" in
            *hd-test/app/bin/yt-dlp*) ;;
            *) echo "the installed application did not name the installed yt-dlp: $found" >&2; exit 1 ;;
          esac

          # The log panel is fed from the same writer chain as the file. A
          # destination that cannot be written to used to silence the rest,
          # which is what made the panel empty on Windows.
          lines=$(curl -sN --max-time 3 http://127.0.0.1:3033/log/sse | grep -c '^event: log' || true)
          echo "log lines replayed to a new reader: $lines"
          if [ "$lines" -lt 1 ]; then
            echo "the log panel would open empty" >&2
            exit 1
          fi

          kill $pid 2>/dev/null || true
          trap - EXIT

          # Removing it has to remove what it installed, and nothing else. An
          # uninstaller that guesses the default location removed a different
          # installation than the one it belonged to.
          /tmp/hd-test/app/uninstall.sh

          for gone in app/bin/happy-downloader config/config.yml; do
            if [ -e "/tmp/hd-test/$gone" ]; then
              echo "the uninstaller left /tmp/hd-test/$gone behind" >&2
              exit 1
            fi
          done
          if [ ! -d /tmp/hd-test/downloads ]; then
            echo "the uninstaller removed the downloads, which it must not" >&2
            exit 1
          fi

      - name: The installer runs (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup is not available"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DBundleDir=$PWD\bundle" "/DAppVersion=0.0.0-test" packaging\windows\happy-downloader.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "the installer was not produced" }
          "built $($setup.Name), $([math]::Round($setup.Length/1MB,1)) MB"

          $dir = "$env:RUNNER_TEMP\hd-test"
          $log = "$env:RUNNER_TEMP\install.log"
          $proc = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log"
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "the installer exited $($proc.ExitCode)"
          }
          Get-Content $log -Tail 25

          # The three files, under the names the configuration uses.
          foreach ($f in 'happy-downloader.exe','yt-dlp.exe','ffmpeg.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "the installer did not produce $dir\$f" }
          }

          # The configuration it wrote, naming those files.
          $cfg = "$env:APPDATA\happy-downloader\config.yml"
          if (-not (Test-Path $cfg)) {
            "APPDATA is $env:APPDATA"
            "anything named config.yml:"
            Get-ChildItem -Path $env:APPDATA, $env:USERPROFILE -Filter config.yml -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 10 -ExpandProperty FullName
            Get-Content $log -Tail 40
            throw "the installer wrote no configuration"
          }
          Get-Content $cfg

          $text = Get-Content $cfg -Raw
          if ($text -notmatch 'yt-dlp\.exe') { throw "the configuration does not name yt-dlp" }
          if ($text -notmatch 'ffmpeg\.exe') { throw "the configuration does not name ffmpeg" }
          if ($text -notmatch 'Downloads') { throw "the configuration does not set a download folder" }

          # And it starts, with the configuration the installer wrote.
          $app = Start-Process -FilePath "$dir\happy-downloader.exe" `
            -ArgumentList '-conf', $cfg -PassThru
          Start-Sleep -Seconds 10

          $found = $null
          try { $found = Invoke-RestMethod -Uri 'http://127.0.0.1:3033/api/v1/version' -TimeoutSec 5 } catch { }
          $found | ConvertTo-Json -Compress

          if (-not $found) { throw "the installed application did not answer" }
          if ($found.ytdlpPath -notmatch 'hd-test') { throw "it is not running the bundled yt-dlp: $($found.ytdlpPath)" }

          # The log panel has to have something to show. It was empty on
          # Windows because the terminal it was written to did not exist and
          # the writer chain stopped there.
          $sse = & curl.exe -sN --max-time 3 http://127.0.0.1:3033/log/sse 2>$null
          $replayed = @($sse | Select-String -SimpleMatch 'event: log').Count
          "log lines replayed to a new reader: $replayed"

          # curl is killed by its own timeout, which is the normal way for that
          # command to stop. Its exit code is not this step's result, and in
          # PowerShell a native command's exit code becomes exactly that.
          $global:LASTEXITCODE = 0

          if ($replayed -lt 1) { throw "the log panel would open empty" }

          try { Stop-Process -Id $app.Id -Force } catch { }
