name: Test

# Runs on every push, so a broken commit is visible before a tag is cut. The
# release workflow repeats these checks, but by then the tag already exists and
# a failed build is a failed release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        env:
          GOARCH: amd64
          GOOS: linux
        run: ./scripts/build.sh happy-downloader

      # The bundle has to run in the last Chrome that installs on Windows 7.
      # Syntax is handled by the build target; an API that does not exist yet
      # is not, so it is checked here.
      - name: Browser support
        run: node frontend/scripts/check-browser-support.mjs



      - name: gofmt
        run: |
          set -eu
          # Reported rather than auto-fixed: a formatting failure in CI should
          # be fixed where it was written, not silently rewritten here.
          unformatted=$(gofmt -l server main.go)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Tags and releases are the same list. The check needs the whole tag set and
  # the GitHub API, so it is its own job rather than a step in the build.
  releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # Includes the translation-parity check: a missing key falls back to
      # English silently, so it has to be a test rather than something noticed
      # later.
      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run

  # The Windows installer.
  #
  # This is what a release publishes, so it is checked on every push rather
  # than only when a release is cut. An installer that is missing a program
  # looks complete and fails on the first download; one that names its programs
  # rather than pointing at them runs whatever the machine happens to have.
  #
  # The check is an installation, not a build: the installer is run, the
  # configuration it wrote is read back, the installed application is started,
  # and it is asked which yt-dlp it is using.
  #
  # Windows only, because that is the only platform with an installer. The
  # Linux build is compiled and unit-tested in the backend job; nothing is
  # published for it.
  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            platform: windows
            suffix: windows-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            name="${name}.exe"
          fi
          ./scripts/build.sh "$name"

      # Compiled and run on Windows, because what it checks is a Windows-only
      # property: whether a child process is given a console window. There is
      # nothing to see on Linux, and nothing would fail there either way.
      - name: The child processes stay quiet
        if: matrix.platform == 'windows'
        shell: bash
        run: go test ./server/internal/tools/ ./server/internal/downloaders/ -run 'TestQuiet|TestPreparedProcess' -v

      - name: Stage the files the installer needs
        shell: bash
        run: |
          set -eu
          ./scripts/stage.sh stage "${{ matrix.platform }}" "${{ matrix.goarch }}"

      # The programs have to be found beside the application, and the paths
      # reported have to be those files rather than whatever the machine has
      # installed. A bare name in that answer means the search order decided.
      - name: The application finds its programs
        shell: bash
        run: |
          set -eu
          # Named exactly: the staging directory also holds the icon, and
          # "happy-downloader*" matches it.
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            name="${name}.exe"
          fi

          app="stage/$name"
          if [ -z "$app" ]; then
            echo "nothing was staged: no application in stage/" >&2
            exit 1
          fi

          "$app" -conf ./no-such-config.yml > app.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          sleep 10

          found=$(curl -s --max-time 5 http://127.0.0.1:3033/api/v1/version || true)
          echo "$found"
          tail -20 app.log || true

          case "$found" in
            *yt-dlp*|*yt-dlp.exe*) ;;
            *) echo "the staged application did not find yt-dlp: $found" >&2; exit 1 ;;
          esac
          case "$found" in
            *ffmpeg*|*ffmpeg.exe*) ;;
            *) echo "the staged application did not find ffmpeg: $found" >&2; exit 1 ;;
          esac

          kill $pid 2>/dev/null || true
          trap - EXIT

      - name: The installer runs (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }

          # The version the installer carries is the one the binary reports,
          # which is the tag. A different one here produced an installer whose
          # name said one thing and whose program said another.
          $version = (git describe --tags --abbrev=0 2>$null)
          if (-not $version) { $version = 'v0.0.0' }
          $version = $version.TrimStart('v')

          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DBundleDir=$PWD\stage" "/DAppVersion=$version" packaging\windows\happy-downloader.iss
          if ($LASTEXITCODE -ne 0) { throw "the installer did not build" }

          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "the installer was not produced" }
          "built $($setup.Name), $([math]::Round($setup.Length/1MB,1)) MB"

          $log = "$env:RUNNER_TEMP\install.log"
          $dir = "$env:RUNNER_TEMP\hd-test"
          $proc = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log"
          if ($proc.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "the installer exited $($proc.ExitCode)"
          }

          foreach ($f in 'happy-downloader.exe','yt-dlp.exe','ffmpeg.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "the installer did not produce $dir\$f" }
          }

          # The shortcut icon comes from the executable, so an executable with
          # no icon resource is a shortcut with a blank one.
          $bytes = [System.IO.File]::ReadAllBytes("$dir\happy-downloader.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch '\.rsrc') { throw "the executable carries no resource section, so it has no icon" }

          $cfg = "$env:APPDATA\happy-downloader\config.yml"
          if (-not (Test-Path $cfg)) {
            Get-Content $log -Tail 40
            throw "the installer wrote no configuration"
          }
          Get-Content $cfg

          $cfgText = Get-Content $cfg -Raw
          if ($cfgText -notmatch 'yt-dlp\.exe') { throw "the configuration does not name yt-dlp" }
          if ($cfgText -notmatch 'ffmpeg\.exe') { throw "the configuration does not name ffmpeg" }
          if ($cfgText -notmatch 'Downloads') { throw "the configuration does not set a download folder" }

          $app = Start-Process -FilePath "$dir\happy-downloader.exe" `
            -ArgumentList '-conf', $cfg -PassThru
          Start-Sleep -Seconds 10

          $found = $null
          try { $found = Invoke-RestMethod -Uri 'http://127.0.0.1:3033/api/v1/version' -TimeoutSec 5 } catch { }
          $found | ConvertTo-Json -Compress

          if (-not $found) {
            # The application's own log says what it did with its window and
            # whether it reached the port.
            $appLog = "$env:APPDATA\happy-downloader\happy-downloader.log"
            "--- the application log ---"
            if (Test-Path $appLog) { Get-Content $appLog -Tail 30 } else { "no log at $appLog" }
            throw "the installed application did not answer"
          }
          if ($found.ytdlpPath -notmatch 'hd-test') { throw "it is not running the installed yt-dlp: $($found.ytdlpPath)" }

          $sse = & curl.exe -sN --max-time 3 http://127.0.0.1:3033/log/sse 2>$null
          $replayed = @($sse | Select-String -SimpleMatch 'event: log').Count
          "log lines replayed to a new reader: $replayed"

          # curl is killed by its own timeout, which is the normal way for that
          # command to stop. Its exit code is not this step's result, and in
          # PowerShell a native command's exit code becomes exactly that.
          $global:LASTEXITCODE = 0

          if ($replayed -lt 1) { throw "the log panel would open empty" }

          # A second copy must not start beside the first: it cannot have the
          # port, and the browser would end up showing the version that is
          # already running rather than the one just installed.
          # Polled rather than waited for a fixed time: startup opens the
          # database and converts the cookie file before it reaches the port,
          # so "not exited yet" says nothing four seconds in.
          $second = Start-Process -FilePath "$dir\happy-downloader.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while (-not $second.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not $second.HasExited) {
            $logFile = "$env:APPDATA\happy-downloader\happy-downloader.log"
            "--- the application log ---"
            if (Test-Path $logFile) { Get-Content $logFile -Tail 40 } else { "no log at $logFile" }
            "--- listening sockets on 3033 ---"
            Get-NetTCPConnection -LocalPort 3033 -ErrorAction SilentlyContinue |
              Select-Object LocalAddress, State, OwningProcess
            Stop-Process -Id $second.Id -Force
            throw "a second copy kept running beside the first"
          }
          "the second copy exited with code $($second.ExitCode) instead of competing for the port"
          if ($second.ExitCode -ne 0) { throw "the second copy failed instead of stepping aside" }

          try { Stop-Process -Id $app.Id -Force } catch { }

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: installer_windows-amd64
          path: dist/*setup.exe
          retention-days: 14

