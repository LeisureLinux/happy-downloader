name: Test

# Runs on every push, so a broken commit is visible before a tag is cut. The
# release workflow repeats these checks, but by then the tag already exists and
# a failed build is a failed release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        env:
          GOARCH: amd64
          GOOS: linux
        run: ./scripts/build.sh happy-downloader

      # The bundle has to run in the last Chrome that installs on Windows 7.
      # Syntax is handled by the build target; an API that does not exist yet
      # is not, so it is checked here.
      - name: Browser support
        run: node frontend/scripts/check-browser-support.mjs



      - name: gofmt
        run: |
          set -eu
          # Reported rather than auto-fixed: a formatting failure in CI should
          # be fixed where it was written, not silently rewritten here.
          unformatted=$(gofmt -l server main.go)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Tags and releases are the same list. The check needs the whole tag set and
  # the GitHub API, so it is its own job rather than a step in the build.
  releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # Includes the translation-parity check: a missing key falls back to
      # English silently, so it has to be a test rather than something noticed
      # later.
      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run

  # The bundle: the application and the programs it needs, in one folder.
  #
  # It is what most people install, so it is checked on every push rather
  # than only when a release is cut. A bundle that is missing a program looks
  # complete and fails on the first download, and one whose programs are found
  # by name rather than by path runs whatever the machine happens to have.
  #
  # It runs on Windows as well as on Linux, because the Windows bundle is the
  # one that was never built before and the one that is most likely to have
  # something wrong in it.
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            platform: linux
            suffix: linux-amd64
          - os: windows-latest
            goarch: amd64
            platform: windows
            suffix: windows-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          GOOS: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          name="happy-downloader_${{ matrix.suffix }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            name="${name}.exe"
          fi
          ./scripts/build.sh "$name"

      - name: The bundle
        shell: bash
        run: |
          set -eu
          ./scripts/bundle.sh bundle "${{ matrix.platform }}" "${{ matrix.goarch }}"

          for program in yt-dlp ffmpeg; do
            found=$(find bundle -maxdepth 1 -name "$program*" | head -1)
            if [ -z "$found" ]; then
              echo "the bundle has no $program in it" >&2
              exit 1
            fi
          done

          # The application has to find them beside itself, and report where
          # it found them. A name rather than a path in that answer means the
          # working directory decided which copy ran.
          # The application is found by name rather than by the name the
          # build gave it, because the build names it differently on
          # Windows.
          app=$(find bundle -maxdepth 1 -name 'happy-downloader*' -type f | head -1)
          if [ -z "$app" ]; then
            echo "the bundle has no application in it" >&2
            exit 1
          fi

          # The configuration is not read, so the application uses its
          # defaults, which put the state in the working directory.
          "$app" -conf ./no-such-config.yml > app.log 2>&1 &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          sleep 10

          found=$(curl -s --max-time 5 http://127.0.0.1:3033/api/v1/version || true)
          echo "$found"
          cat app.log 2>/dev/null | tail -20 || true

          case "$found" in
            *'"ytdlpPath":'*'/yt-dlp'*) ;;
            *) echo "the application did not find the bundled yt-dlp: $found" >&2; exit 1 ;;
          esac
          case "$found" in
            *'"ffmpegPath":'*'/ffmpeg'*) ;;
            *) echo "the application did not find the bundled ffmpeg: $found" >&2; exit 1 ;;
          esac

          kill $pid 2>/dev/null || true
          trap - EXIT
