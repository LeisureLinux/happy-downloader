name: Test

# Runs on every push, so a broken commit is visible before a tag is cut. The
# release workflow repeats these checks, but by then the tag already exists and
# a failed build is a failed release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The frontend is embedded with go:embed, so the package cannot even be
      # type-checked until dist/ exists.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build
        env:
          GOARCH: amd64
          GOOS: linux
        run: ./scripts/build.sh happy-downloader

      # The bundle has to run in the last Chrome that installs on Windows 7.
      # Syntax is handled by the build target; an API that does not exist yet
      # is not, so it is checked here.
      - name: Browser support
        run: node frontend/scripts/check-browser-support.mjs

      # The bundle is what most people install, so it is checked here rather
      # than only when a release is cut.
      #
      # What is checked is that it holds what it should and that the
      # application finds it: a bundle that is missing a program looks
      # complete and fails on the first download, and one whose programs are
      # found by name rather than by path runs whatever the machine happens
      # to have.
      - name: The bundle
        run: |
          set -eu
          mv happy-downloader happy-downloader_linux-amd64
          ./scripts/bundle.sh /tmp/bundle linux amd64

          for program in yt-dlp ffmpeg; do
            found=$(find /tmp/bundle -maxdepth 1 -name "$program" | head -1)
            if [ -z "$found" ]; then
              echo "the bundle has no $program in it" >&2
              exit 1
            fi
            if [ ! -x "$found" ]; then
              echo "$found is not executable" >&2
              exit 1
            fi
          done

          # The application has to find them beside itself, and report where
          # it found them — a name rather than a path means the working
          # directory decided which copy ran.
          /tmp/bundle/happy-downloader_linux-amd64 -conf /dev/null &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          sleep 10

          found=$(curl -s --max-time 5 http://127.0.0.1:3033/api/v1/version || true)
          echo "$found"

          case "$found" in
            *'"ytdlpPath":"/tmp/bundle/yt-dlp"'*) ;;
            *) echo "the application did not find the bundled yt-dlp: $found" >&2; exit 1 ;;
          esac
          case "$found" in
            *'"ffmpegPath":"/tmp/bundle/ffmpeg"'*) ;;
            *) echo "the application did not find the bundled ffmpeg: $found" >&2; exit 1 ;;
          esac

          kill $pid 2>/dev/null || true
          trap - EXIT

      - name: gofmt
        run: |
          set -eu
          # Reported rather than auto-fixed: a formatting failure in CI should
          # be fixed where it was written, not silently rewritten here.
          unformatted=$(gofmt -l server main.go)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  # Tags and releases are the same list. The check needs the whole tag set and
  # the GitHub API, so it is its own job rather than a step in the build.
  releases:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every tag has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-releases.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      # Includes the translation-parity check: a missing key falls back to
      # English silently, so it has to be a test rather than something noticed
      # later.
      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run
