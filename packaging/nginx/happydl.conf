# Happy Downloader — happydl.lan
#
# Copy to /etc/nginx/conf.d/happydl.conf, then:
#   nginx -t && systemctl reload nginx
#
# The app listens on 127.0.0.1:3033 and is proxied here. It has no built-in
# login, so this block is what keeps it to the LAN: bind it to the internal
# address only, and do not forward the port at the router.

upstream happy_downloader {
    server 127.0.0.1:3033;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name happydl.lan;

    # Nothing here is worth caching at the edge: the API is live state and the
    # frontend is a hashed bundle that changes on release.
    access_log /var/log/nginx/happydl.access.log;
    error_log  /var/log/nginx/happydl.error.log;

    # Video files can be large and downloads are long; the app streams files
    # through /filebrowser/ and a body limit here would truncate uploads, not
    # downloads, but keep it generous anyway.
    client_max_body_size 32m;

    location / {
        proxy_pass http://happy_downloader;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The download list and progress are pushed over a WebSocket at
        # /rpc/ws. Without these three lines nginx buffers the upgrade request
        # and the connection dies at once, which looks like the app failing to
        # connect rather than a proxy problem.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long downloads and slow clients: the default 60s cuts a download that
        # is still transferring, and a stalled one that should be allowed to
        # finish.
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
        proxy_connect_timeout 30s;

        # Serving a 2 GiB file through a proxy buffer means writing it to disk
        # twice. Stream it.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Video streaming wants range requests passed through untouched.
    location /filebrowser/ {
        proxy_pass http://happy_downloader;
        proxy_http_version 1.1;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
